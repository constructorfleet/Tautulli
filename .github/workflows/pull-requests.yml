name: Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened]

jobs:
  check-branch:
    name: Check Pull Request
    runs-on: ubuntu-latest
    # Upstream takes PRs on nightly only. This fork has no nightly branch, so
    # the check would fail on every PR here.
    if: github.repository == 'Tautulli/Tautulli'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Comment on Pull Request
        uses: mshick/add-pr-comment@v3
        if: github.base_ref != 'nightly'
        with:
          message: Pull requests must be made to the `nightly` branch. Thanks.
          repo-token: ${{ github.token }}

      - name: Fail Workflow
        if: github.base_ref != 'nightly'
        run: |
          echo Base: "$GITHUB_BASE_REF"
          echo Head: "$GITHUB_HEAD_REF"
          exit 1
